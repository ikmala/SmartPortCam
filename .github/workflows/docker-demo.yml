name: Build & Push Demo Docker Image

on:
  push:
    branches: [main]
    paths:
      - "web_dashboard/**"          # trigger hanya jika ada perubahan di web_dashboard
  workflow_dispatch:                 # bisa dijalankan manual dari GitHub Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: ./web_dashboard
          file: ./web_dashboard/Dockerfile
          push: true
          tags: |
            ikmal05/smartportcam-demo:latest
            ikmal05/smartportcam-demo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed → ikmal05/smartportcam-demo:latest"
